<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>用户登录 - 课堂专注度分析系统</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-box">
    <h1>课堂专注度分析系统</h1>
    <p class="login-sub">基于 Python Web 的课堂专注度分析系统设计与实现</p>
    <form id="loginForm">
      <div class="form-row">
        <label for="username">用户名</label>
        <input id="username" name="username" type="text" autocomplete="username" style="width:100%" required>
      </div>
      <div class="form-row">
        <label for="password">密码</label>
        <input id="password" name="password" type="password" autocomplete="current-password" style="width:100%" required>
      </div>
      <div class="form-row">
        <label class="checkbox" style="margin:0">
          <input type="checkbox" id="rememberMe"> 记住密码
        </label>
      </div>
      <div id="loginError" class="notice error" style="display:none"></div>
      <button class="btn btn-primary btn-block" type="submit" id="loginBtn">登 录</button>
    </form>
    <div class="login-foot">初始管理员账号 admin / admin123，登录后请及时修改密码<br>「记住密码」仅在本机保存账号并延长登录有效期，不会保存明文密码</div>
  </div>
</div>
<div id="toast" class="toast"></div>
<script src="/static/js/common.js"></script>
<script src="/static/js/login.js"></script>
</body>
</html>
