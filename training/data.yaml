# ---------------------------------------------------------------------------
# YOLOv8 课堂行为数据集配置（修改自原项目 datasets/dataset/data.yaml）
#
# 原配置使用 E:/00code/3.06-code/... 绝对路径，换机器后失效，
# 这里改为相对项目根目录的路径；training/train.py 会在训练前自动解析为绝对路径，
# 因此无论项目放在哪个盘符都可以直接开始训练。
# ---------------------------------------------------------------------------

path: ../datasets/dataset

train: images/train
val: images/val
test: images/test

# 类别数量
nc: 6

# 类别名称（与原项目保持一致）
names:
  0: hand-raising
  1: reading
  2: writing
  3: using phone
  4: bowing the head
  5: leaning over the table
